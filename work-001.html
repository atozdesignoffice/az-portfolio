<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品タイトル — PORTFOLIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafaf8;
      --surface: #f2f2ef;
      --surface2: #e8e8e4;
      --text: #0d0d0d;
      --muted: #999;
      --muted2: #ccc;
      --border: #e0e0da;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Noto Sans JP', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 300;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ─── HEADER ─── */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 3rem;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(250,250,248,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }

    .site-logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      letter-spacing: 0.3em;
      color: var(--text);
    }


    .site-header nav {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      padding: 0 1.5rem;
      background: rgba(250, 250, 248, 0.98);
      border-bottom: 1px solid var(--border);
    }
    
    .site-header nav.is-open {
      display: block;
    }
    
    .site-header .site-nav {
      display: flex;
      flex-direction: column;
      gap: 0;
      list-style: none;
    }
    
    .site-header .site-nav li {
      width: fit-content;
      min-width: 300px;
    }
    
    .site-header .site-nav li + li {
      border-top: 1px solid var(--border);
    }
    
    .site-header .site-nav a {
      display: block;
      padding: 2rem 0;
      color: #0d0d0d;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
    }


    .site-nav a {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 0.25s;
    }

    .site-nav a:hover { color: var(--text); }

    /* ─── MAIN LAYOUT ─── */
    .page-wrapper {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
      padding-top: 64px; /* header height */
    }

    /* ─── LEFT SIDEBAR ─── */
    .sidebar {
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
      padding: 3rem 2.5rem 3rem 3rem;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--text); }

    .back-arrow {
      font-size: 0.75rem;
      transition: transform 0.2s;
    }

    .back-link:hover .back-arrow { transform: translateX(-3px); }

    .work-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      line-height: 1;
      letter-spacing: 0.06em;
    }

    .meta-block {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .meta-row {
      display: flex;
      gap: 0.5rem;
      font-size: 0.75rem;
      line-height: 1.6;
    }

    .meta-label {
      color: var(--muted);
      min-width: 3rem;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      padding-top: 0.08rem;
    }

    .meta-value {
      color: var(--text);
      font-size: 0.78rem;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--muted2);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
    }

    .work-desc {
      font-size: 0.8rem;
      color: #555;
      line-height: 2;
    }

    .work-desc p + p {
      margin-top: 1rem;
    }

    /* ─── RIGHT CONTENT ─── */
    .content-area {
      width: 100%;
      max-width: 1028px;
      margin: 0 auto;
      padding: 3rem 3rem 6rem;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .work-image {
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    
    .work-image img {
      display: block;
      width: 100%;
      height: auto;
    }

    .image-label {
      position: absolute;
      bottom: 1rem;
      right: 1.25rem;
      font-family: var(--font-mono);
      font-size: 0.58rem;
      color: rgba(0,0,0,0.2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* 2カラム画像グリッド */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }

    /* ─── PREV / NEXT ─── */
    .work-nav {
      background: var(--bg);
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--border);
    }

    .work-nav-item {
      padding: 2rem 3rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      cursor: pointer;
      transition: background 0.25s;
    }

    .work-nav-item:hover { background: var(--surface); }

    .work-nav-item + .work-nav-item {
      border-left: 1px solid var(--border);
      align-items: flex-end;
      text-align: right;
    }

    .nav-label {
      font-family: var(--font-mono);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav-title {
      font-size: 0.88rem;
      color: var(--text);
      font-weight: 400;
    }

    .nav-arrow {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
    }
   
/* ─── MENU TOGGLE ─── */
    .menu-toggle {
      display: none;
    }

/* ─── RESPONSIVE ─── */
    @media (max-width: 860px) {
      /* Header */
      .site-header {
        padding: 1.25rem 1.5rem;
      }
    
      .menu-toggle {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 44px;
        padding: 6px 0;
        border: none;
        background: transparent;
        cursor: pointer;
      }
    
      .menu-toggle span {
        display: block;
        width: 32px;
        height: 1px;
        background: var(--text);
      }
    
      .menu-toggle::after {
        content: "MENU";
        font-size: 8px;
        letter-spacing: 0.20em;
        line-height: 1;
        color: var(--text);
      }
    
      .site-header nav {
        display: none;
        position: absolute;
        top: 100%;
        right: 0rem;
        left: auto;
        width: 160px;
        box-sizing: border-box;
        padding: 0 1rem;
        background: rgba(250, 250, 248, 0.98);
        border: 1px solid var(--border);
      }
    
      .site-header nav.is-open {
        display: block;
      }
    
      .site-header .site-nav li {
        width: fit-content;
        min-width: 140px;
      }
      
      .site-header .site-nav li + li {
        border-top: 1px solid var(--border);
      }
    
      .site-header .site-nav a {
        display: block;
        padding: 1.6rem 0;
        color: #0d0d0d;
        font-size: 0.75rem;
        letter-spacing: 0.25em;
      }
    
      /* Page layout */
      .page-wrapper {
        grid-template-columns: 1fr;
        padding-top: 56px;
      }
    
      .sidebar {
        position: static;
        height: auto;
        padding: 2rem 1.5rem;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
    
      .content-area {
        padding: 0 0 4rem;
      }
    
      .work-nav {
        grid-template-columns: 1fr;
      }
    
      .work-nav-item + .work-nav-item {
        border-left: none;
        border-top: 1px solid var(--border);
        align-items: flex-start;
        text-align: left;
      }

      /* スマホでは2カラムを1カラムに変更 */
      .image-grid {
        grid-template-columns: 1fr;
      }

      /* Work images */
      .work-image img {
        width: 100%;
        height: auto;
        object-fit: contain;
        display: block;
      }
    
      .work-image,
      .work-image.tall,
      .work-image.wide,
      .work-image.square {
        aspect-ratio: auto;
        height: auto;
        min-height: 0;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER -->

<header class="site-header">
  <a href="portfolio.html" class="site-logo">PORTFOLIO</a>

  <button
    class="menu-toggle"
    type="button"
    aria-label="メニューを開く"
    aria-expanded="false"
    aria-controls="site-navigation"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="site-navigation">
    <ul class="site-nav">
      <li><a href="#">About</a></li>
      <li><a href="portfolio.html">Works</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</header>


  <!-- MAIN -->
  <div class="page-wrapper">

    <!-- LEFT: 固定サイドバー -->
    <aside class="sidebar">

      <a href="portfolio.html" class="back-link">
        <span class="back-arrow">←</span> Works
      </a>

      <h1 class="work-title">作品タイトル<br>サンプル</h1>

      <div class="tag-row">
        <span class="tag">Graphic</span>
        <span class="tag">Branding</span>
        <span class="tag">Artwork</span>
      </div>

      <hr class="divider">

      <div class="meta-block">
        <div class="meta-row">
          <span class="meta-label">Year</span>
          <span class="meta-value">2025</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">AD+D</span>
          <span class="meta-value">Your Name</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">CL</span>
          <span class="meta-value">クライアント名</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">PH</span>
          <span class="meta-value">フォトグラファー名</span>
        </div>
      </div>

      <hr class="divider">

    </aside>

    <!-- RIGHT: 画像エリア -->
    <div>
      <div class="content-area">

        <!-- メイン画像（大） -->
        <div class="work-image tall">
          <img src="test.jpg" alt="作品名">
        </div>

        <!-- 2カラム画像 -->
        <div class="image-grid">
          <div class="work-image tall">
            <img src="test02.jpg" alt="作品名">
          </div>
          <div class="work-image tall">
            <img src="test.png" alt="作品名">
          </div>
        </div>

        <!-- ワイド画像 -->
        <div class="work-image wide">
            <img src="test.jpg" alt="作品名">
        </div>

        <!-- 2カラム画像 -->
        <div class="image-grid">
          <div class="work-image square">
            <span class="image-label">Image 05</span>
          </div>
          <div class="work-image square">
            <span class="image-label">Image 06</span>
          </div>
        </div>

        <!-- メイン画像（大） -->
        <div class="work-image tall">
          <span class="image-label">Image 07</span>
        </div>

      </div>

      <div class="work-desc">
        <p>ここに作品の説明文を入れてください。プロジェクトのコンセプトや制作背景などを記述します。</p>
        <p>2〜3段落程度が読みやすいです。クライアントへの想いや、デザインの意図なども書くと良いでしょう。</p>
      </div>

      <!-- PREV / NEXT -->
      <nav class="work-nav">
        <div class="work-nav-item">
          <span class="nav-arrow">←</span>
          <span class="nav-label">Previous</span>
          <span class="nav-title">前の作品タイトル</span>
        </div>
        <div class="work-nav-item">
          <span class="nav-arrow">→</span>
          <span class="nav-label">Next</span>
          <span class="nav-title">次の作品タイトル</span>
        </div>
      </nav>
    </div>

  </div>

<script>
  const menuToggle = document.querySelector('.menu-toggle');
  const siteNavigation = document.querySelector('#site-navigation');

  if (menuToggle && siteNavigation) {
    menuToggle.addEventListener('click', () => {
      const isOpen = siteNavigation.classList.toggle('is-open');

      menuToggle.setAttribute('aria-expanded', String(isOpen));
      menuToggle.setAttribute(
        'aria-label',
        isOpen ? 'メニューを閉じる' : 'メニューを開く'
      );
    });

    siteNavigation.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        siteNavigation.classList.remove('is-open');
        menuToggle.setAttribute('aria-expanded', 'false');
        menuToggle.setAttribute('aria-label', 'メニューを開く');
      });
    });
  }
</script>

</body>
</html>
